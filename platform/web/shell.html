<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Rugby 08 in the browser: a static recompilation to WebAssembly</title>
    <!-- platform/web/shell.html: the page around the game canvas (emcc --shell-file); an installable app
         (platform/web/pwa/). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="EA Sports Rugby 08 (PC, 2007) running in a web browser: the game's own code statically recompiled to WebAssembly, Direct3D 8 drawn with WebGL 2. Bring your own copy of the game.">
    <meta name="theme-color" content="#125c30">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="pwa/icon-192.png">
    <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
      body { margin: 0; padding: 8px; background: #111; color: #ccc; font: 13px system-ui, sans-serif; }
      .emscripten { display: block; margin: 0 auto; text-align: center; }
      .emscripten_border { margin: 8px auto; }
      canvas.emscripten { border: 0; background: #000; }
      #controls { display: block; text-align: center; margin: 4px 0; }
      #output { display: block; width: 100%; max-width: 960px; margin: 8px auto; background: #000; color: #8f8;
                border: 0; font: 11px monospace; }
      .spinner { height: 24px; width: 24px; margin: 8px auto; border: 3px solid #333; border-top-color: #8f8;
                 border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <span id='controls'>
      <span><input type="checkbox" id="resize">Resize canvas</span>
      <span><input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer &nbsp;&nbsp;&nbsp;</span>
      <span><input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked,
                                                                                document.getElementById('resize').checked)">
      </span>
    </span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <div id="view" style="position:relative;width:fit-content;margin:0 auto">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
        <div id="fps" style="position:absolute;top:0;left:0;padding:2px 6px;font:bold 14px monospace;color:#0f0;background:rgba(0,0,0,.5);pointer-events:none;z-index:1"></div>
      </div>
    </div>
    <textarea id="output" rows="8"></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // the browser may restore old text

      // A lost WebGL context cannot be restored: the game's textures and buffers are gone with it.
      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      var setStatus = (text) => {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
        if (text === setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        // if this is a progress update, skip it if too soon
        if (m && now - setStatus.last.time < 30) return;
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2])*100;
          progressElement.max = parseInt(m[4])*100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.style.display = 'none';
        }
        statusElement.innerHTML = text;
      };

#if MODULARIZE && !EXPORT_ES6
      var moduleArgs = {
#else
      var tail = [];
      var Module = {
#endif
        // the game traces thousands of lines: keep them out of the browser console (it logs every one,
        // stderr as an error) unless the page is opened with ?log; the text box shows the latest 40
        print(...args) {
          var line = args.join(' ');
          if (/[?&]log\b/.test(location.search)) console.log(line);
          if (outputElement) {
            tail.push(line); if (tail.length > 40) tail.shift();
            outputElement.value = tail.join("\n");
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        printErr(...args) { Module.print(...args); },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      setStatus('Downloading...');
      // fps: Module.rtFrames is bumped by IDirect3DDevice8::Present, but several Presents can land between
      // two browser paints (the pacer yields by message when behind) and only the last one shows. So each
      // paint (rAF) checks whether a new Present arrived and counts those (the fps you see); 'worst' is the
      // longest gap between new images in the window.
      var fpsElement = document.getElementById('fps'), fpsLast = { t: performance.now(), n: 0 };
      var paintSeen = 0, shown = 0, lastNew = 0, worstGap = 0;
      (function paint(t) {
        var n = Module.rtFrames | 0;
        if (n !== paintSeen) {
          paintSeen = n;
          shown++;
          if (lastNew) worstGap = Math.max(worstGap, t - lastNew);
          lastNew = t;
        }
        requestAnimationFrame(paint);
      })(performance.now());
      setInterval(() => {
        var t = performance.now(), n = Module.rtFrames | 0, s = 1000 / (t - fpsLast.t);
        if (n) fpsElement.textContent = Math.round(shown * s) + ' fps, worst ' + Math.round(worstGap) + ' ms';
        fpsLast = { t: t, n: n };
        shown = worstGap = 0;
      }, 500);
      // fullscreen puts the canvas in its own container: move the counter along with it
      document.addEventListener('fullscreenchange', () => {
        (document.fullscreenElement || document.getElementById('view')).appendChild(fpsElement);
      });
      window.onerror = window.onunhandledrejection = () => {
        setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
    <script>
      // The installable app (platform/web/pwa/sw.js): localhost or HTTPS only. A new deploy is a new worker
      // (checked at every start, never from the HTTP cache); the page itself always comes fresh when online.
      if ('serviceWorker' in navigator)
        navigator.serviceWorker
          .register('sw.js', { updateViaCache: 'none' })
          .then((r) => r.update())
          .catch(() => {});
    </script>
#if MODULARIZE && !EXPORT_ES6
    <script type='text/javascript'>
      {{{ EXPORT_NAME }}}(moduleArgs);
    </script>
#endif
  </body>
</html>
